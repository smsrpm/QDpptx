    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="12" stdDeviation="10" flood-color="#0B1222" flood-opacity="0.45"/>
    </filter>
    <filter id="winshadow" x="-20%" y="-20%" width="140%" height="140%">
