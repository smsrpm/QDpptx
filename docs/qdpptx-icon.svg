<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A5C"/>
      <stop offset="1" stop-color="#16203A"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F2F4"/>
      <stop offset="1" stop-color="#E2E4E7"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3293F"/>
      <stop offset="1" stop-color="#6D1426"/>
    </linearGradient>
    <linearGradient id="port" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A86E0"/>
      <stop offset="1" stop-color="#1F4E9E"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
